[package]
description = "Convert video files to be compatible with DaVinci Resolve"
edition = "2024"
license = "GPL-3.0-or-later"
name = "resolvefy"
version = "0.1.0"

[dependencies]
ffmpeg-next = "8.1"
gtk4 = {version = "0.11.4", features = ["v4_14"]}
libadwaita = {version = "0.9.2", features = ["v1_4", "v1_6", "v1_9"]}

[package.metadata.generate-rpm]
assets = [
  {source = "target/release/resolvefy", dest = "/usr/bin/resolvefy", mode = "755"},
]
[package.metadata.generate-rpm.requires]
ffmpeg = ">= 8.1"
libadwaita = ">= 1.9"
