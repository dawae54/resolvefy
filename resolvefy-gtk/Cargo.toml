[package]
name = "resolvefy-gtk"
version = "1.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Convert video files to be compatible with DaVinci Resolve (GTK4/libadwaita UI)"
keywords = ["ffmpeg", "davinci-resolve", "video", "gtk", "av1"]
categories = ["multimedia::video", "gui"]

[dependencies]
resolvefy-core = "1.1.0"
gtk4 = {version = "0.11.4", features = ["v4_14"]}
libadwaita = {version = "0.9.2", features = ["v1_4"]}

[package.metadata.deb]
maintainer = "Álvaro Berenguer"
copyright = "2026, Álvaro Berenguer"
extended-description = "Convert video files to be compatible with DaVinci Resolve using a GTK4/libadwaita interface"
section = "utils"
priority = "optional"
depends = "ffmpeg (>= 7.0), libadwaita-1-0 (>= 1.4)"
assets = [
  ["target/release/resolvefy-gtk", "usr/bin/resolvefy-gtk", "755"],
  ["ui/resolvefy-gtk.desktop", "usr/share/applications/resolvefy-gtk.desktop", "644"],
]

[package.metadata.generate-rpm]
assets = [
  {source = "target/release/resolvefy-gtk", dest = "/usr/bin/resolvefy-gtk", mode = "755"},
  {source = "ui/resolvefy-gtk.desktop", dest = "/usr/share/applications/resolvefy-gtk.desktop", mode = "644"},
]

[package.metadata.generate-rpm.requires]
ffmpeg = ">= 7.0"
libadwaita = ">= 1.4"
